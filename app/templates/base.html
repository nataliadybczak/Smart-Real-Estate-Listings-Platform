<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}Flats for sale in Kraków{% endblock %} · Smart Listings
    </title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='style.css') }}?v=3"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="logo" href="/">Smart<span>Listings</span></a>
        <span class="topbar__note">Find your perfect place</span>
      </div>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    <script src="{{ url_for('static', path='app.js') }}?v=3" defer></script>
  </body>
</html>
